[project]
name = "quantum-workflow"
version = "0.1.0"
description = "Requirement-to-Project Planning for Quantum Workflows"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "QJump.ai" }]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "sqlalchemy>=2.0",
    "anthropic>=0.20",
    "openai>=1.10",
    "jinja2>=3.1",
    "qiskit>=1.0",
    "qiskit-aer>=0.13",
    "qiskit-algorithms>=0.3",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "respx>=0.20",
    "ruff>=0.3",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
